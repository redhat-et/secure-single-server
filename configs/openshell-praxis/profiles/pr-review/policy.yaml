version: 1
filesystem_policy:
  # Home is /sandbox in the workload image; it must be writable for the
  # harness config install and the agent's clone/reports workspace.
  include_workdir: true
  read_only: [/usr, /lib, /lib64, /etc, /proc, /dev/urandom, /opt]
  read_write: [/sandbox, /home, /tmp, /dev/null]
landlock: {compatibility: best_effort}
network_policies:
  praxis_gateway:
    name: praxis-gateway
    endpoints:
      - {host: host.openshell.internal, port: @@PRAXIS_PORT@@, protocol: rest, access: read-write, enforcement: enforce}
    binaries: [{path: /usr/bin/node-26}, {path: /usr/local/bin/opencode}]
  github_api:
    name: github-api
    endpoints: [{host: api.github.com, port: 443, protocol: rest, enforcement: enforce, access: read-only}]
    binaries: [{path: /usr/bin/node-26}, {path: /usr/bin/git}]
  github_git:
    name: github-git
    endpoints: [{host: github.com, port: 443}]
    binaries: [{path: /usr/bin/git}]
