# Valkey profile. This differs from shared-gateway.yaml only in the
# token_rate_limit backends. Request-rate and Switchyard state remain in memory.

admin:
  address: "127.0.0.1:9901"

telemetry:
  sampling_rate: 1.0

listeners:
  - name: openai
    address: "0.0.0.0:8080"
    filter_chains: [openai]
  - name: anthropic
    address: "0.0.0.0:8081"
    filter_chains: [anthropic]

filter_chains:
  - name: openai
    filters:
      - filter: request_id
      - filter: access_log
      - filter: headers
        request_remove:
          - Authorization
          - Proxy-Authorization
          - Forwarded
          - X-Forwarded-For
          - X-Forwarded-Host
          - X-Forwarded-Proto
          - X-Real-IP
          - Via
          - X-App-Id
          - X-Cluster
          - X-Model
          - X-Route
          - X-Selected-Model
          - X-Tier
      - filter: rate_limit
        mode: global
        rate: 2
        burst: 10
      - filter: token_rate_limit
        backend:
          kind: valkey
          url: "${TOKEN_RATE_LIMIT_VALKEY_URL}"
          namespace: secure-single-server:limits:openai
        rules:
          - name: openai-rolling-day
            algorithm: sliding_window
            window: "24h"
            capacity: 1000000
            reserved_tokens: 10000
            reservation_timeout: "300s"
      - filter: token_count
        provider: openai
      - filter: router
        routes:
          - path_prefix: "/"
            cluster: openai
      - filter: credential_injection
        clusters:
          - name: openai
            header: Authorization
            header_prefix: "Bearer "
            env_var: OPENAI_API_KEY
      - filter: load_balancer
        clusters:
          - name: openai
            endpoints: ["api.openai.com:443"]
            http:
              authority: "api.openai.com"
            tls:
              sni: "api.openai.com"

  - name: anthropic
    filters:
      - filter: request_id
      - filter: access_log
      - filter: headers
        request_remove:
          - Authorization
          - Proxy-Authorization
          - Forwarded
          - X-Forwarded-For
          - X-Forwarded-Host
          - X-Forwarded-Proto
          - X-Real-IP
          - Via
          - X-Api-Key
          - X-App-Id
          - X-Cluster
          - X-Model
          - X-Route
          - X-Selected-Model
          - X-Tier
      - filter: rate_limit
        mode: global
        rate: 2
        burst: 10
      - filter: token_rate_limit
        backend:
          kind: valkey
          url: "${TOKEN_RATE_LIMIT_VALKEY_URL}"
          namespace: secure-single-server:limits:anthropic
        rules:
          - name: anthropic-rolling-day
            algorithm: sliding_window
            window: "24h"
            capacity: 1000000
            reserved_tokens: 10000
            reservation_timeout: "300s"
      - filter: anthropic_messages_protocol
      - filter: token_count
        provider: anthropic
      - filter: router
        routes:
          - path_prefix: "/"
            cluster: anthropic
      - filter: credential_injection
        clusters:
          - name: anthropic
            header: x-api-key
            env_var: ANTHROPIC_API_KEY
      - filter: load_balancer
        clusters:
          - name: anthropic
            endpoints: ["api.anthropic.com:443"]
            http:
              authority: "api.anthropic.com"
            tls:
              sni: "api.anthropic.com"
