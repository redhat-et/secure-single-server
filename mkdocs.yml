site_name: Secure single-server AI harness
site_description: >-
  Run OpenCode and OpenClaw on one dedicated RHEL 9 host with OpenShell,
  Praxis, and bootc.
site_url: https://redhat-et.github.io/secure-single-server/
repo_url: https://github.com/redhat-et/secure-single-server
repo_name: redhat-et/secure-single-server
edit_uri: edit/main/
copyright: Experimental demonstration, not a production-ready platform.

# The repository keeps component documentation next to the code it describes.
# scripts/docs/stage.py assembles those Markdown sources here without changing
# their repository-relative paths, so relative links keep working.
docs_dir: .docs-build
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.select
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: README.md
  - Start here:
      - Introduction: docs/README.md
      - Architecture walkthrough: docs/quickstarts/architecture-walkthrough/README.md
      - Bootc quickstart: docs/quickstarts/bootc/README.md
      - Podman quickstart: docs/quickstarts/podman/README.md
  - Deployment:
      - OpenShell single server:
          - Overview: docs/quickstarts/openshell-single-server/README.md
          - Manual container deployment: docs/quickstarts/openshell-single-server/manual.md
          - Bootc deployment: docs/quickstarts/openshell-single-server/bootc.md
          - Model endpoint configuration: docs/quickstarts/openshell-single-server/model-access.md
          - Verification: docs/quickstarts/openshell-single-server/verification.md
          - Qualification and policy reference: docs/quickstarts/openshell-single-server/reference.md
      - OpenShell + Praxis:
          - Overview: docs/quickstarts/openshell-praxis/README.md
          - Install: docs/quickstarts/openshell-praxis/install.md
          - Harness configuration: docs/quickstarts/openshell-praxis/harness-configuration.md
          - OpenClaw bounded tasks: docs/quickstarts/openshell-praxis/openclaw.md
          - Integration matrix: docs/quickstarts/openshell-praxis/users.md
      - All-in-one gateway:
          - Overview: docs/quickstarts/all-in-one/README.md
          - In-memory deployment: docs/quickstarts/all-in-one/in-memory.md
          - Valkey deployment: docs/quickstarts/all-in-one/valkey.md
          - Switchyard deployment: docs/quickstarts/all-in-one/switchyard.md
          - Create a user login: docs/quickstarts/all-in-one/accounts.md
          - User setup and usage: docs/quickstarts/all-in-one/users.md
      - Remote HTTPS/JWT gateway:
          - Overview: docs/quickstarts/remote-gateway/README.md
          - Install: docs/quickstarts/remote-gateway/install.md
          - User setup: docs/quickstarts/remote-gateway/users.md
      - Optional vLLM inference:
          - Mutable RHEL deployment: docs/quickstarts/vllm/README.md
          - Bootc image deployment: bootc/VLLM.md
  - Scenarios:
      - Overview: docs/examples/README.md
      - Praxis token quotas: docs/examples/praxis-quotas/README.md
      - Streamlit before and after OpenShell: docs/examples/streamlit-security/README.md
      - OpenCode PR-candidate queue: docs/examples/opencode-pr-queue/README.md
      - Demo task prompt: docs/examples/opencode-pr-queue/demo-task.md
      - Review as a service: docs/development/review-service.md
  - Additional information:
      - OpenShell overview: openshell/docs/README.md
      - OpenShell threat model: openshell/docs/threat-model.md
      - OpenShell policy walkthrough: openshell/docs/policy-walkthrough.md
      - OpenCode: openshell/harnesses/opencode/README.md
      - OpenClaw: openshell/harnesses/openclaw/README.md

not_in_nav: |
  bootc/README.md
  bootc/VALIDATION.md
  bootc/VLLM-VALIDATION.md
  openshell/harnesses/opencode/review-agents.md
  openshell/harnesses/opencode/pr-queue/instructions.md
  openshell/demos/streamlit-security/README.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - callouts

hooks:
  - scripts/docs/mkdocs_hooks.py

watch:
  - docs
  - bootc
  - openshell

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/redhat-et/secure-single-server
      name: Secure single-server AI harness on GitHub
