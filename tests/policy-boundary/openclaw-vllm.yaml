version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /lib64, /etc, /proc, /dev/urandom, /opt]
  read_write: [/sandbox, /home, /tmp, /dev/null]
landlock: {compatibility: best_effort}
network_policies:
  praxis_gateway:
    name: praxis-gateway
    endpoints:
      - {host: host.openshell.internal, port: 18080, protocol: rest, access: read-write, enforcement: enforce}
    binaries: [{path: /usr/bin/node-26}, {path: /usr/local/bin/openclaw}]
