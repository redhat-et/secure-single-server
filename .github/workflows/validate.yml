name: Validate gateway scenarios

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-images:
    name: Native ${{ matrix.arch }} images and static checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            shellcheck_arch: x86_64
            shellcheck_sha256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
          - runner: ubuntu-24.04-arm
            arch: arm64
            shellcheck_arch: aarch64
            shellcheck_sha256: 68a8133197a50beb8803f8d42f9908d1af1c5540d4bb05fdfca8c1fa47decefc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install static-check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq ripgrep ruby zsh
      - name: Install pinned ShellCheck
        env:
          # Update both matrix checksums when changing this version.
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_ARCH: ${{ matrix.shellcheck_arch }}
          SHELLCHECK_SHA256: ${{ matrix.shellcheck_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$(mktemp -d "${RUNNER_TEMP}/shellcheck.XXXXXX")"
          archive="${install_dir}/shellcheck.tar.gz"
          release_url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}"
          curl --fail --show-error --silent --location --retry 3 \
            "${release_url}/shellcheck-v${SHELLCHECK_VERSION}.linux.${SHELLCHECK_ARCH}.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${SHELLCHECK_SHA256}" "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${install_dir}"
          bin_dir="${install_dir}/shellcheck-v${SHELLCHECK_VERSION}"
          "${bin_dir}/shellcheck" --version
          "${bin_dir}/shellcheck" --version | grep -Fx "version: ${SHELLCHECK_VERSION}"
          printf '%s\n' "${bin_dir}" >> "${GITHUB_PATH}"
      - name: Check scripts, templates, documentation, and regressions
        run: tests/shared-gateway-static.sh
      - name: Check native runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          source scripts/common/lib.sh
          test "$(oci_architecture "$(uname -m)")" = "$EXPECTED_ARCH"
      - name: Start pinned Praxis profiles without provider keys
        env:
          CONTAINER_ENGINE: docker
        run: tests/shared-gateway-image.sh
      - name: Verify Valkey ACL and persistence without provider keys
        env:
          CONTAINER_ENGINE: docker
        run: tests/shared-gateway-valkey-image.sh
      - name: Offline caller credentials and AWS planning safety
        run: |
          python3 tests/remote-gateway/credentials.py
          python3 tests/remote-gateway/security.py
          python3 tests/aws/plan.py
          python3 tests/aws/session.py
      - name: Verify native TLS and JWT with synthetic providers
        env:
          CONTAINER_ENGINE: docker
        run: |
          python3 tests/remote-gateway/image.py
          python3 tests/remote-gateway/image.py --valkey
